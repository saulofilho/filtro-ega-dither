<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtro EGA Dither</title>
<style>
  :root { --bg:#14001a; --fg:#ffd0ff; --accent:#ff10ff; --muted:#9a00b8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-monospace,Menlo,monospace; }
  header { padding:16px; border-bottom:2px solid var(--muted); }
  h1 { margin:0; font-size:18px; color:var(--accent); letter-spacing:2px; }
  main { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px; }
  @media (max-width:760px){ main{ grid-template-columns:1fr; } }
  #drop { border:2px dashed var(--muted); padding:24px 12px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); background:#2a0030; }
  label { display:block; margin-top:12px; }
  label span { float:right; color:#fff; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  button { margin-top:16px; width:100%; padding:10px; background:var(--accent); color:#000; border:0; font:inherit; font-weight:bold; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  #view { overflow:auto; min-height:300px; display:flex; align-items:flex-start; justify-content:center; }
  canvas { image-rendering:pixelated; max-width:100%; height:auto; }
  .hint { color:#b080c0; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header><h1>FILTRO EGA DITHER</h1></header>
<main>
  <section>
    <div id="drop">Arraste uma foto aqui<br>ou clique para escolher<input id="file" type="file" accept="image/*" hidden></div>
    <label>Colunas (grão) <span id="v-cols"></span><input id="cols" type="range" min="120" max="640" step="8" value="320"></label>
    <label>Ampliação <span id="v-scale"></span><input id="scale" type="range" min="1" max="6" step="1" value="3"></label>
    <label>Grade magenta <span id="v-grade"></span><input id="grade" type="range" min="0" max="1" step="0.05" value="0.85"></label>
    <label>Quente (terra → laranja) <span id="v-warm"></span><input id="warm" type="range" min="0" max="2" step="0.05" value="0.6"></label>
    <label>Contraste <span id="v-contrast"></span><input id="contrast" type="range" min="0.5" max="2" step="0.05" value="1.25"></label>
    <label>Saturação <span id="v-saturation"></span><input id="saturation" type="range" min="0" max="2.5" step="0.05" value="1.3"></label>
    <label>Penalidade de mistura <span id="v-spread"></span><input id="spread" type="range" min="0" max="0.6" step="0.02" value="0.2"></label>
    <label>Suavização <span id="v-smooth"></span><input id="smooth" type="range" min="0" max="3" step="1" value="1"></label>
    <button id="save" disabled>Baixar PNG</button>
    <p class="hint">Tudo roda no seu navegador; a foto não sai do computador.</p>
  </section>
  <section id="view"><canvas id="out" width="640" height="400"></canvas></section>
</main>
<script>
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const PAL = ["#000000","#ffffff","#2018f0","#9a00b8","#ff10ff","#ffff48","#ff8a30","#d82018","#5a0a3a"].map(hex);
const COOL = [[0,"#000000"],[.18,"#2018f0"],[.36,"#9a00b8"],[.58,"#ff10ff"],[.80,"#ffa0ff"],[.95,"#ffffff"]].map(([s,c])=>[s,hex(c)]);
const WARM = [[0,"#000000"],[.20,"#5a0a3a"],[.40,"#d82018"],[.62,"#ff8a30"],[.82,"#ffff48"],[.97,"#ffffff"]].map(([s,c])=>[s,hex(c)]);
const BAYER = [[0,2],[3,1]].map(r => r.map(v => v/4 + .125));
const W = [.30,.59,.11].map(Math.sqrt);

function ramp(l, stops){
  if (l <= stops[0][0]) return stops[0][1];
  for (let i=1;i<stops.length;i++){
    const [x1,c1]=stops[i];
    if (l <= x1){ const [x0,c0]=stops[i-1], t=(l-x0)/(x1-x0); return [0,1,2].map(k=>c0[k]+(c1[k]-c0[k])*t); }
  }
  return stops[stops.length-1][1];
}

function buildMixes(spreadPen){
  const m=[];
  for (let i=0;i<PAL.length;i++) for (let j=i;j<PAL.length;j++)
    for (const r of [0,.25,.5,.75,1]){
      if (i===j && r!==0) continue;
      const a=PAL[i], b=PAL[j];
      const sp=Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
      m.push({i,j,r,c:[0,1,2].map(k=>a[k]*(1-r)+b[k]*r),pen:(spreadPen*sp)**2*.25});
    }
  return m;
}

// filtros de suavização no canvas reduzido: moda 3x3 aproximada por mediana + blur leve
function smoothPass(d,w,h){
  const src=new Float32Array(d), out=d;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) for (let k=0;k<3;k++){
    const vals=[];
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
      const yy=Math.min(h-1,Math.max(0,y+dy)), xx=Math.min(w-1,Math.max(0,x+dx));
      vals.push(src[(yy*w+xx)*4+k]);
    }
    vals.sort((a,b)=>a-b);
    out[(y*w+x)*4+k]=vals[4]*.7+(vals[3]+vals[5])*.15;
  }
}

let img=null;
const $ = id => document.getElementById(id);
const ids=["cols","scale","grade","warm","contrast","saturation","spread","smooth"];

function render(){
  ids.forEach(id => $("v-"+id).textContent=$(id).value);
  if (!img) return;
  const p=Object.fromEntries(ids.map(id=>[id,parseFloat($(id).value)]));
  const cols=p.cols, rows=Math.max(1,Math.round(img.height/img.width*cols/2));
  const tmp=document.createElement("canvas"); tmp.width=cols; tmp.height=rows;
  const tc=tmp.getContext("2d"); tc.imageSmoothingQuality="high";
  tc.filter=`contrast(${p.contrast}) saturate(${p.saturation})`;
  tc.drawImage(img,0,0,cols,rows);
  const id=tc.getImageData(0,0,cols,rows), d=id.data;
  for (let s=0;s<p.smooth;s++) smoothPass(d,cols,rows);
  const mixes=buildMixes(p.spread);
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){
    const o=(y*cols+x)*4;
    const r=d[o]/255,g=d[o+1]/255,b=d[o+2]/255;
    const lum=.299*r+.587*g+.114*b, mx=Math.max(r,g,b), mn=Math.min(r,g,b), sat=(mx-mn)/(mx+1e-6);
    const warm=Math.min(1,Math.max(0,((r-b)*2.2+(g-b)*.6)*(.4+sat)*p.warm));
    const c1=ramp(lum,COOL), c2=ramp(lum,WARM);
    const t=[0,1,2].map(k=>{ const m=c1[k]*(1-warm)+c2[k]*warm; return d[o+k]*(1-p.grade)+m*p.grade; });
    let best=null,bd=Infinity;
    for (const m of mixes){
      const e=((t[0]-m.c[0])*W[0])**2+((t[1]-m.c[1])*W[1])**2+((t[2]-m.c[2])*W[2])**2+m.pen;
      if (e<bd){bd=e;best=m;}
    }
    const c=PAL[BAYER[y%2][x%2]<best.r?best.j:best.i];
    d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
  }
  tc.filter="none"; tc.putImageData(id,0,0);
  const out=$("out"); out.width=cols*p.scale; out.height=rows*p.scale*2;
  const oc=out.getContext("2d"); oc.imageSmoothingEnabled=false;
  oc.drawImage(tmp,0,0,out.width,out.height);
  $("save").disabled=false;
}

let pending=0;
const schedule=()=>{ cancelAnimationFrame(pending); pending=requestAnimationFrame(render); };
ids.forEach(id=>$(id).addEventListener("input",schedule));

function load(file){
  if (!file || !file.type.startsWith("image/")) return;
  const im=new Image(); im.onload=()=>{ img=im; render(); }; im.src=URL.createObjectURL(file);
}
const drop=$("drop");
drop.onclick=()=>$("file").click();
$("file").onchange=e=>load(e.target.files[0]);
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>load(e.dataTransfer.files[0]));
$("save").onclick=()=>{ const a=document.createElement("a"); a.download="ega-dither.png"; a.href=$("out").toDataURL("image/png"); a.click(); };
render();
</script>
</body>
</html>
